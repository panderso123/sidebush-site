name = "sidebush-art"
compatibility_date = "2024-11-06"
# Serve straight from the repo root: index.html, assets/ and functions/ already
# live here, so Git-integration builds need no build step. (The old "dist" value
# required a macOS-only build script that can't run on Cloudflare's Linux builders,
# which made every GitHub-triggered build fail with "output directory not found".)
pages_build_output_dir = "."

# Optional: fulfillment-queue storage for /api/orders.
# 1) npx wrangler kv namespace create ORDERS
# 2) paste the returned id below and uncomment.
# [[kv_namespaces]]
# binding = "ORDERS"
# id = "PASTE_KV_NAMESPACE_ID"

# Secrets are NOT stored here. Set them with:
#   npx wrangler pages secret put STRIPE_SECRET_KEY --project-name sidebush-art
#   npx wrangler pages secret put STRIPE_WEBHOOK_SECRET --project-name sidebush-art
#   npx wrangler pages secret put ADMIN_TOKEN --project-name sidebush-art
